<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sri Lanka 3D Flight Simulator</title>

<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css">
<script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>

<style>
* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
}
html, body, #cesiumContainer {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #111;
  font-family: Arial, sans-serif;
}
#cesiumContainer { position: absolute; inset: 0; }

#hud {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
  padding: 10px;
  border: 1px solid #00eaff;
  border-radius: 12px;
  background: #061a2de8;
  color: #00eaff;
  font: bold 12px monospace;
  z-index: 5;
  white-space: nowrap;
}

#locations {
  position: absolute;
  top: 60px;
  left: 0;
  right: 0;
  padding: 5px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 5px;
  z-index: 5;
}
button {
  cursor: pointer;
  touch-action: none;
}
.place, .control {
  color: #00eaff;
  background: #061a2de8;
  border: 1px solid #00eaff;
  border-radius: 8px;
  padding: 8px 10px;
  font-weight: bold;
}
.place { font-size: 11px; }

#controls {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 20px;
  padding: 0 18px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  z-index: 5;
  pointer-events: none;
}
#joystick {
  position: relative;
  width: 120px;
  height: 120px;
  border: 2px solid #00eaffaa;
  background: #00eaff22;
  border-radius: 50%;
  touch-action: none;
  pointer-events: auto;
}
#stick {
  position: absolute;
  width: 44px;
  height: 44px;
  left: 36px;
  top: 36px;
  border-radius: 50%;
  background: #00eaff;
  box-shadow: 0 0 12px #00eaff;
  pointer-events: none;
}
#altControls {
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: auto;
}
.control {
  width: 58px;
  height: 48px;
  font-size: 20px;
}
#message {
  position: absolute;
  bottom: 160px;
  left: 50%;
  transform: translateX(-50%);
  max-width: 90%;
  color: white;
  background: #061a2de8;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 12px;
  z-index: 5;
  text-align: center;
}
#message:empty { display: none; }

@media (max-width: 380px) {
  #hud { gap: 7px; font-size: 10px; padding: 8px; }
  .place { padding: 6px; font-size: 10px; }
  #joystick { width: 105px; height: 105px; }
  #stick { left: 29px; top: 29px; }
}
</style>
</head>

<body>
<div id="cesiumContainer"></div>

<div id="hud">
  <div>SPD <span id="spd">120</span></div>
  <div>ALT <span id="alt">600</span> m</div>
  <div>HDG <span id="hdg">000</span>°</div>
</div>

<div id="locations">
  <button class="place" data-lat="7.957" data-lon="80.7603" data-alt="600">🏰 Sigiriya</button>
  <button class="place" data-lat="6.9271" data-lon="79.8612" data-alt="500">🏙️ Colombo</button>
  <button class="place" data-lat="6.8096" data-lon="80.7891" data-alt="2600">🏔️ Pidurutalagala</button>
  <button class="place" data-lat="6.8667" data-lon="81.0466" data-alt="1200">⛰️ Ella</button>
  <button class="place" data-lat="7.2906" data-lon="80.6337" data-alt="700">🌄 Kandy</button>
</div>

<div id="controls">
  <div id="joystick" aria-label="Flight joystick">
    <div id="stick"></div>
  </div>

  <div id="altControls">
    <button class="control" id="btnUp" aria-label="Climb">▲</button>
    <button class="control" id="btnDown" aria-label="Descend">▼</button>
  </div>
</div>

<div id="message">Loading 3D terrain...</div>
